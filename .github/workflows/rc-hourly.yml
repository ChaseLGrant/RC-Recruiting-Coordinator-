# Keeps RC current: every hour, runs due recruiting searches and re-checks
# linked stat and schedule pages on your live site.
# Setup (GitHub repo → Settings → Secrets and variables → Actions):
#   RC_URL       your site, e.g. https://rc-recruiting.vercel.app
#   CRON_SECRET  the same value you set in Vercel
name: RC hourly update
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Run due missions and stat/schedule checks
        env:
          RC_URL: ${{ secrets.RC_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$RC_URL" ] || [ -z "$CRON_SECRET" ]; then echo "RC_URL / CRON_SECRET not set yet; skipping."; exit 0; fi
          curl --fail --silent --show-error --max-time 290 -H "Authorization: Bearer $CRON_SECRET" "$RC_URL/api/cron"
